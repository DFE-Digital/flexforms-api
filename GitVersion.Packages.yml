# Versioning for NuGet packages released from main (see .github/workflows/pack-template.yml).
# Kept separate from GitVersion.yml so app release branches don't change package versions.
mode: ContinuousDelivery
semantic-version-format: Loose
major-version-bump-message: '(?i)\+semver:\s?(breaking|major)'
minor-version-bump-message: '(?i)\+semver:\s?(feature|minor)'
patch-version-bump-message: '(?i)\+semver:\s?(fix|patch)'

branches:
  main:
    increment: Patch
    label: ''

  pull-request:
    increment: Patch
    source-branches: ['main']
    label: prerelease
